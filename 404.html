    <script>
        (function () {
            const ua = navigator.userAgent;
            const platform = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
            const touchMac = /mac/i.test(platform) && navigator.maxTouchPoints > 1;
            const path = location.pathname.replace(/\/+$/, '').toLowerCase();
            let device = 'linux';
            if (path.endsWith('/windows')) device = 'android';
            else if (path.endsWith('/fluid')) device = 'fluid';
            else if (path.endsWith('/macos')) device = 'macos';
            else if (path.endsWith('/linux')) device = 'linux';
            else if (path.endsWith('/material')) device = 'windows';
            else if (/android/i.test(ua)) device = 'android';
            else if (/ipad/i.test(ua) || touchMac || /iphone|ipod/i.test(ua) || /macintosh|mac os x/i.test(ua)) device = 'macos';
            else if (/win/i.test(platform) || /windows/i.test(ua)) device = 'windows';
            document.body.dataset.device = device;
        })();
    </script>

    <script>
        const container = document.querySelector('.container');
        const player = document.getElementById('rickroll-player');
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
        let draggedOrb = null;
        const orbs = [...document.querySelectorAll('.orb')].map((node, index) => ({
            node,
            x: 120 + index * 150,
            y: 120 + (index % 3) * 55,
            vx: (index % 2 ? -1 : 1) * (1.6 + index * 0.18),
            vy: 0,
            radius: 100,
            index,
            dragOffsetX: 0,
            dragOffsetY: 0,
            lastX: 0,
            lastY: 0
        }));

        const clampOrbs = () => {
            orbs.forEach((orb) => {
                orb.radius = orb.node.getBoundingClientRect().width / 2;
                orb.x = Math.min(Math.max(orb.x, orb.radius), window.innerWidth - orb.radius);
                orb.y = Math.min(Math.max(orb.y, orb.radius), window.innerHeight - orb.radius);
            });
        };

        const startRickroll = () => {
            if (document.body.dataset.device === 'linux') return;
            if (player.firstChild) return;
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&playsinline=1&rel=0';
            iframe.title = 'Rickroll audio';
            iframe.allow = 'autoplay; encrypted-media';
            player.appendChild(iframe);
        };

        if (document.body.dataset.device === 'android') {
            document.addEventListener('click', (event) => {
                if (document.body.dataset.device === 'linux') return;
                if (!container.contains(event.target)) startRickroll();
            });
        } else {
        document.addEventListener('mousemove', (event) => {
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            pointer.active = true;

            if (draggedOrb) {
                const nextX = event.clientX + draggedOrb.dragOffsetX;
                const nextY = event.clientY + draggedOrb.dragOffsetY;
                draggedOrb.vx = (nextX - draggedOrb.lastX) * 0.7;
                draggedOrb.vy = (nextY - draggedOrb.lastY) * 0.7;
                draggedOrb.x = nextX;
                draggedOrb.y = nextY;
                draggedOrb.lastX = nextX;
                draggedOrb.lastY = nextY;
            }

            const xAxis = (window.innerWidth / 2 - event.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - event.pageY) / 25;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            pointer.active = false;
            container.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        document.addEventListener('click', (event) => {
            if (document.body.dataset.device === 'linux') return;
            orbs.forEach((orb) => {
                const dx = orb.x - event.clientX;
                const dy = orb.y - event.clientY;
                const distance = Math.hypot(dx, dy) || 1;
                const force = Math.max(0.35, 1 - distance / 900);
                orb.vx += (dx / distance) * (8 + force * 16);
                orb.vy -= 22 + force * 18;
                orb.node.classList.add('is-jumping');
                window.setTimeout(() => orb.node.classList.remove('is-jumping'), 360);
            });

            if (!container.contains(event.target) && !event.target.closest('.orb')) {
                startRickroll();
            }
        });

        orbs.forEach((orb) => {
            orb.node.addEventListener('mousedown', (event) => {
                event.preventDefault();
                draggedOrb = orb;
                pointer.active = true;
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                orb.dragOffsetX = orb.x - event.clientX;
                orb.dragOffsetY = orb.y - event.clientY;
                orb.lastX = orb.x;
                orb.lastY = orb.y;
                orb.vx = 0;
                orb.vy = 0;
                orb.node.classList.add('is-dragged');
            });
        });

        document.addEventListener('mouseup', () => {
            if (!draggedOrb) return;
            draggedOrb.node.classList.remove('is-dragged');
            draggedOrb = null;
        });

        const animate = () => {
            orbs.forEach((orb) => {
                if (orb === draggedOrb) return;

                orb.vy += 0.72;

                if (pointer.active) {
                    const dx = orb.x - pointer.x;
                    const dy = orb.y - pointer.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const repelRadius = orb.radius + 180;
                    if (distance < repelRadius) {
                        const force = (1 - distance / repelRadius) * 4.2;
                        orb.vx += (dx / distance) * force;
                        orb.vy += (dy / distance) * force;
                    }
                }
            });

            for (let i = 0; i < orbs.length; i += 1) {
                for (let j = i + 1; j < orbs.length; j += 1) {
                    const a = orbs[i];
                    const b = orbs[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const minDistance = a.radius + b.radius + 10;
                    if (distance < minDistance) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const overlap = (minDistance - distance) / 2;
                        a.x -= nx * overlap;
                        a.y -= ny * overlap;
                        b.x += nx * overlap;
                        b.y += ny * overlap;

                        const relativeVelocity = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                        const impulse = Math.max(0.5, -relativeVelocity * 0.62);
                        a.vx -= nx * impulse;
                        a.vy -= ny * impulse;
                        b.vx += nx * impulse;
                        b.vy += ny * impulse;
                    }
                }
            }

            orbs.forEach((orb) => {
                if (orb === draggedOrb) {
                    orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
                    return;
                }

                orb.vx *= 0.992;
                orb.vy *= 0.992;
                orb.x += orb.vx;
                orb.y += orb.vy;

                const minX = orb.radius;
                const maxX = window.innerWidth - orb.radius;
                const minY = orb.radius;
                const maxY = window.innerHeight - orb.radius;

                if (orb.x < minX || orb.x > maxX) {
                    orb.x = Math.min(Math.max(orb.x, minX), maxX);
                    orb.vx *= -0.72;
                }

                if (orb.y < minY || orb.y > maxY) {
                    orb.y = Math.min(Math.max(orb.y, minY), maxY);
                    orb.vy *= -0.64;
                    orb.vx *= 0.965;
                }

                orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
            });

            requestAnimationFrame(animate);
        };

        window.addEventListener('resize', clampOrbs);
        clampOrbs();
        animate();
        }
    </script>

                            tty.insertAdjacentHTML('beforeend', 'bin  boot  dev  etc  home  lib  lib64  mnt  opt  proc  root  run  sbin  srv  sys  tmp  usr  var<br>');
                        } else if (val === 'cat bio.txt') {
                            await printBio404();
                        } else if (val === 'cd ~' || val === 'cd /') {
                            location.href = '/linux';
                        } else if (val === 'help') {
                            tty.insertAdjacentHTML('beforeend', 'Доступные команды:<br>  clear       - очистить терминал<br>  ai          - запустить AI прямо здесь<br>  fastfetch   - показать инфу о системе<br>  bash 404.sh - показать 404 ошибку<br>  ls          - показать файлы<br>  cat bio.txt - перейти в bio<br>  help        - показать это сообщение<br>');
                        } else if (val !== '') {
                            tty.insertAdjacentHTML('beforeend', 'bash: ' + val + ': команда не найдена<br>');
                        }
                        showPrompt404();
                    }
                });
            };

            const runTty = () => {
                currentHtml += lines[0] + '<br><br>';
                tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                
                setTimeout(() => {
                    currentHtml += 'pixel login: ';
                    typeText('jettax', () => {
                        setTimeout(() => {
                            currentHtml += 'Password: ';
                            tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                            setTimeout(() => {
                                currentHtml += '<br>';
                                currentHtml += '<span class="tty-blue">jettax</span><span class="tty-mauve">@pixel</span> <span class="tty-green">~$</span> ';
                                typeText('bash 404.sh', () => {
                                    setTimeout(() => {
                                        currentHtml = '<div class="tty-ascii">' + ascii404 + '</div><br>';
                                        tty.innerHTML = currentHtml;
                                        showPrompt404();
                                    }, 800);
                                });
                            }, 2500);
                        }, 500);
                    });
                }, 500);
            };
            
            setTimeout(runTty, 500);
        }
    </script>
