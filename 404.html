<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | JettaX</title>
    <meta name="description" content="Страница не найдена на сайте JettaX.">
    <link rel="icon" href="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/404/style.css">
</head>
<body>
    <main class="page-shell" aria-labelledby="page-title">
        <div class="orb-layer" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="orb orb-three"></span>
        </div>

        <section class="container">
            <div class="error-code" aria-label="Ошибка 404">
                <span class="digit">4</span>
                <div class="zero-container" aria-hidden="true">
                    <div class="avatar-mask">
                        <img src="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" alt="">
                        <span class="material-symbols-outlined fallback-icon">question_mark</span>
                    </div>
                </div>
                <span class="digit">4</span>
            </div>

            <h1 id="page-title">Страница не найдена</h1>
            <p class="message">Такой страницы нет. Зато есть повод вернуться на главную и сделать вид, что этого перехода не было.</p>

            <div class="actions">
                <a href="/" class="cta-button">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Вернуться на главную
                </a>
            </div>
        </section>
    </main>

    <script>
        const container = document.querySelector('.container');
        const orbNodes = [...document.querySelectorAll('.orb')];
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
        const basePoints = [
            { x: 0.08, y: 0.26 },
            { x: 0.86, y: 0.28 },
            { x: 0.68, y: 0.82 }
        ];
        const orbs = orbNodes.map((node, index) => ({
            node,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            baseX: 0,
            baseY: 0,
            radius: 120,
            index
        }));

        const placeOrbs = () => {
            orbs.forEach((orb) => {
                const rect = orb.node.getBoundingClientRect();
                orb.radius = rect.width / 2;
                orb.baseX = window.innerWidth * basePoints[orb.index].x;
                orb.baseY = window.innerHeight * basePoints[orb.index].y;
                if (!orb.x && !orb.y) {
                    orb.x = orb.baseX;
                    orb.y = orb.baseY;
                }
            });
        };

        document.addEventListener('mousemove', (event) => {
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            pointer.active = true;

            const offsetX = event.clientX / window.innerWidth - 0.5;
            const offsetY = event.clientY / window.innerHeight - 0.5;
            container.style.transform = `translate3d(${-offsetX * 28}px, ${-offsetY * 20}px, 0) rotateY(${-offsetX * 5}deg) rotateX(${offsetY * 5}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            pointer.active = false;
            container.style.transform = 'translate3d(0, 0, 0) rotateY(0deg) rotateX(0deg)';
        });

        document.addEventListener('click', (event) => {
            orbs.forEach((orb) => {
                const dx = orb.x - event.clientX;
                const dy = orb.y - event.clientY;
                const distance = Math.hypot(dx, dy) || 1;
                const force = Math.max(0, 1 - distance / 700);
                orb.vx += (dx / distance) * (10 + force * 18);
                orb.vy += (dy / distance) * (10 + force * 18) - 14;
                orb.node.classList.add('is-jumping');
                window.setTimeout(() => orb.node.classList.remove('is-jumping'), 360);
            });

            if (!container.contains(event.target)) {
                window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank', 'noopener,noreferrer');
            }
        });

        const animate = () => {
            orbs.forEach((orb) => {
                orb.vx += (orb.baseX - orb.x) * 0.006;
                orb.vy += (orb.baseY - orb.y) * 0.006;

                if (pointer.active) {
                    const dx = orb.x - pointer.x;
                    const dy = orb.y - pointer.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const repelRadius = orb.radius + 210;
                    if (distance < repelRadius) {
                        const force = (1 - distance / repelRadius) * 2.8;
                        orb.vx += (dx / distance) * force;
                        orb.vy += (dy / distance) * force;
                    }
                }
            });

            for (let i = 0; i < orbs.length; i += 1) {
                for (let j = i + 1; j < orbs.length; j += 1) {
                    const a = orbs[i];
                    const b = orbs[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const minDistance = a.radius + b.radius + 16;
                    if (distance < minDistance) {
                        const overlap = (minDistance - distance) / 2;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        a.x -= nx * overlap;
                        a.y -= ny * overlap;
                        b.x += nx * overlap;
                        b.y += ny * overlap;
                        const push = 0.34;
                        a.vx -= nx * push;
                        a.vy -= ny * push;
                        b.vx += nx * push;
                        b.vy += ny * push;
                    }
                }
            }

            orbs.forEach((orb) => {
                orb.vx *= 0.9;
                orb.vy *= 0.9;
                orb.x += orb.vx;
                orb.y += orb.vy;

                const minX = orb.radius * 0.45;
                const maxX = window.innerWidth - orb.radius * 0.45;
                const minY = orb.radius * 0.45;
                const maxY = window.innerHeight - orb.radius * 0.45;

                if (orb.x < minX || orb.x > maxX) {
                    orb.x = Math.min(Math.max(orb.x, minX), maxX);
                    orb.vx *= -0.55;
                }

                if (orb.y < minY || orb.y > maxY) {
                    orb.y = Math.min(Math.max(orb.y, minY), maxY);
                    orb.vy *= -0.55;
                }

                orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
            });

            requestAnimationFrame(animate);
        };

        window.addEventListener('resize', placeOrbs);
        placeOrbs();
        animate();
    </script>
</body>
</html>
