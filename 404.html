<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | JettaX</title>
    <meta name="description" content="Страница не найдена на сайте JettaX.">
    <link rel="icon" href="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/404/style.css">
</head>
<body>
    <main class="page-shell" aria-labelledby="page-title">
        <div class="orb-layer" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="orb orb-three"></span>
            <span class="orb orb-four"></span>
            <span class="orb orb-five"></span>
            <span class="orb orb-six"></span>
        </div>

        <section class="container">
            <div class="error-code" aria-label="Ошибка 404">
                <span class="digit">4</span>
                <div class="zero-container" aria-hidden="true">
                    <div class="avatar-mask">
                        <img src="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" alt="">
                        <span class="material-symbols-outlined fallback-icon">question_mark</span>
                    </div>
                </div>
                <span class="digit">4</span>
            </div>

            <h1 id="page-title">Страница не найдена</h1>
            <p class="message">Такой страницы нет. Зато есть повод вернуться на главную и сделать вид, что этого перехода не было.</p>

            <div class="actions">
                <a href="/" class="cta-button">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Вернуться на главную
                </a>
            </div>
        </section>
    </main>
    <div id="rickroll-player" aria-hidden="true"></div>

    <script>
        const container = document.querySelector('.container');
        const player = document.getElementById('rickroll-player');
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
        const orbs = [...document.querySelectorAll('.orb')].map((node, index) => ({
            node,
            x: 120 + index * 150,
            y: 120 + (index % 3) * 55,
            vx: (index % 2 ? -1 : 1) * (1.6 + index * 0.18),
            vy: 0,
            radius: 100,
            index
        }));

        const clampOrbs = () => {
            orbs.forEach((orb) => {
                orb.radius = orb.node.getBoundingClientRect().width / 2;
                orb.x = Math.min(Math.max(orb.x, orb.radius), window.innerWidth - orb.radius);
                orb.y = Math.min(Math.max(orb.y, orb.radius), window.innerHeight - orb.radius);
            });
        };

        const startRickroll = () => {
            if (player.firstChild) return;
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&playsinline=1&rel=0';
            iframe.title = 'Rickroll audio';
            iframe.allow = 'autoplay; encrypted-media';
            player.appendChild(iframe);
        };

        document.addEventListener('mousemove', (event) => {
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            pointer.active = true;

            const xAxis = (window.innerWidth / 2 - event.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - event.pageY) / 25;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            pointer.active = false;
            container.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        document.addEventListener('click', (event) => {
            orbs.forEach((orb) => {
                const dx = orb.x - event.clientX;
                const dy = orb.y - event.clientY;
                const distance = Math.hypot(dx, dy) || 1;
                const force = Math.max(0.35, 1 - distance / 900);
                orb.vx += (dx / distance) * (8 + force * 16);
                orb.vy -= 22 + force * 18;
                orb.node.classList.add('is-jumping');
                window.setTimeout(() => orb.node.classList.remove('is-jumping'), 360);
            });

            if (!container.contains(event.target)) {
                startRickroll();
            }
        });

        const animate = () => {
            orbs.forEach((orb) => {
                orb.vy += 0.72;

                if (pointer.active) {
                    const dx = orb.x - pointer.x;
                    const dy = orb.y - pointer.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const repelRadius = orb.radius + 180;
                    if (distance < repelRadius) {
                        const force = (1 - distance / repelRadius) * 4.2;
                        orb.vx += (dx / distance) * force;
                        orb.vy += (dy / distance) * force;
                    }
                }
            });

            for (let i = 0; i < orbs.length; i += 1) {
                for (let j = i + 1; j < orbs.length; j += 1) {
                    const a = orbs[i];
                    const b = orbs[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const minDistance = a.radius + b.radius + 10;
                    if (distance < minDistance) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const overlap = (minDistance - distance) / 2;
                        a.x -= nx * overlap;
                        a.y -= ny * overlap;
                        b.x += nx * overlap;
                        b.y += ny * overlap;

                        const relativeVelocity = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                        const impulse = Math.max(0.5, -relativeVelocity * 0.62);
                        a.vx -= nx * impulse;
                        a.vy -= ny * impulse;
                        b.vx += nx * impulse;
                        b.vy += ny * impulse;
                    }
                }
            }

            orbs.forEach((orb) => {
                orb.vx *= 0.992;
                orb.vy *= 0.992;
                orb.x += orb.vx;
                orb.y += orb.vy;

                const minX = orb.radius;
                const maxX = window.innerWidth - orb.radius;
                const minY = orb.radius;
                const maxY = window.innerHeight - orb.radius;

                if (orb.x < minX || orb.x > maxX) {
                    orb.x = Math.min(Math.max(orb.x, minX), maxX);
                    orb.vx *= -0.72;
                }

                if (orb.y < minY || orb.y > maxY) {
                    orb.y = Math.min(Math.max(orb.y, minY), maxY);
                    orb.vy *= -0.64;
                    orb.vx *= 0.965;
                }

                orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
            });

            requestAnimationFrame(animate);
        };

        window.addEventListener('resize', clampOrbs);
        clampOrbs();
        animate();
    </script>
</body>
</html>
