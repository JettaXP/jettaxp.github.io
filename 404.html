<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | JettaX</title>
    <meta name="description" content="Страница не найдена на сайте JettaX.">
    <link rel="icon" href="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/404/style.css">
</head>
<body>
    <main class="page-shell" aria-labelledby="page-title">
        <div class="orb-layer" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="orb orb-three"></span>
        </div>

        <section class="container">
            <div class="error-code" aria-label="Ошибка 404">
                <span class="digit">4</span>
                <div class="zero-container" aria-hidden="true">
                    <div class="video-mask">
                        <iframe
                            id="rickroll"
                            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ&controls=0&modestbranding=1&playsinline=1&rel=0"
                            title="Rickroll"
                            allow="autoplay; encrypted-media; picture-in-picture"
                            loading="lazy">
                        </iframe>
                        <span class="material-symbols-outlined fallback-icon">question_mark</span>
                    </div>
                </div>
                <span class="digit">4</span>
            </div>

            <h1 id="page-title">Страница не найдена</h1>
            <p class="message">Этого адреса нет, зато сюрприз уже подгрузился. Можно вернуться назад, пока припев не застрял в голове.</p>

            <div class="actions">
                <a href="/" class="cta-button">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Вернуться на главную
                </a>
            </div>
        </section>
    </main>

    <script>
        const container = document.querySelector('.container');
        const videoMask = document.querySelector('.video-mask');
        const root = document.documentElement;
        const orbs = document.querySelectorAll('.orb');

        window.addEventListener('load', () => {
            videoMask.classList.add('has-video');
        });

        document.addEventListener('mousemove', (event) => {
            const xAxis = (window.innerWidth / 2 - event.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - event.pageY) / 45;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;

            const pointerX = event.clientX / window.innerWidth - 0.5;
            const pointerY = event.clientY / window.innerHeight - 0.5;
            root.style.setProperty('--pointer-x', pointerX.toFixed(4));
            root.style.setProperty('--pointer-y', pointerY.toFixed(4));
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0deg) rotateX(0deg)';
            root.style.setProperty('--pointer-x', '0');
            root.style.setProperty('--pointer-y', '0');
        });

        document.addEventListener('click', (event) => {
            root.style.setProperty('--click-x', `${event.clientX}px`);
            root.style.setProperty('--click-y', `${event.clientY}px`);

            orbs.forEach((orb, index) => {
                window.setTimeout(() => {
                    orb.classList.remove('is-clicked');
                    void orb.offsetWidth;
                    orb.classList.add('is-clicked');
                }, index * 45);
            });
        });
    </script>
</body>
</html>
