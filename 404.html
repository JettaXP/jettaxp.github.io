<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | JettaX</title>
    <meta name="description" content="Страница не найдена на сайте JettaX.">
    <link rel="icon" href="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/404/style.css">
</head>
<body>
    <main class="page-shell" aria-labelledby="page-title">
        <div class="orb-layer" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="orb orb-three"></span>
        </div>

        <section class="container">
            <div class="error-code" aria-label="Ошибка 404">
                <span class="digit">4</span>
                <div class="zero-container" aria-hidden="true">
                    <div class="avatar-mask" id="rickroll-trigger">
                        <img src="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" alt="">
                        <span class="material-symbols-outlined fallback-icon">question_mark</span>
                    </div>
                </div>
                <span class="digit">4</span>
            </div>

            <h1 id="page-title">Страница не найдена</h1>
            <p class="message">Такой страницы нет. Зато есть повод вернуться на главную и сделать вид, что этого перехода не было.</p>

            <div class="actions">
                <a href="/" class="cta-button">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Вернуться на главную
                </a>
            </div>
        </section>
    </main>

    <script>
        const root = document.documentElement;
        const orbs = document.querySelectorAll('.orb');
        const rickrollTrigger = document.getElementById('rickroll-trigger');

        const updateOrbPosition = (event) => {
            const pointerX = event.clientX / window.innerWidth - 0.5;
            const pointerY = event.clientY / window.innerHeight - 0.5;

            root.style.setProperty('--orb-one-x', `${pointerX * 92}px`);
            root.style.setProperty('--orb-one-y', `${pointerY * 58}px`);
            root.style.setProperty('--orb-two-x', `${pointerX * -78}px`);
            root.style.setProperty('--orb-two-y', `${pointerY * 88}px`);
            root.style.setProperty('--orb-three-x', `${pointerX * -112}px`);
            root.style.setProperty('--orb-three-y', `${pointerY * -52}px`);
        };

        document.addEventListener('mousemove', (event) => {
            updateOrbPosition(event);
        });

        document.addEventListener('mouseleave', () => {
            root.style.setProperty('--orb-one-x', '0px');
            root.style.setProperty('--orb-one-y', '0px');
            root.style.setProperty('--orb-two-x', '0px');
            root.style.setProperty('--orb-two-y', '0px');
            root.style.setProperty('--orb-three-x', '0px');
            root.style.setProperty('--orb-three-y', '0px');
        });

        document.addEventListener('click', (event) => {
            root.style.setProperty('--click-x', `${event.clientX}px`);
            root.style.setProperty('--click-y', `${event.clientY}px`);

            orbs.forEach((orb, index) => {
                window.setTimeout(() => {
                    orb.classList.remove('is-clicked');
                    void orb.offsetWidth;
                    orb.classList.add('is-clicked');
                    window.setTimeout(() => orb.classList.remove('is-clicked'), 680);
                }, index * 45);
            });
        });

        rickrollTrigger.addEventListener('click', () => {
            window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank', 'noopener,noreferrer');
        });
    </script>
</body>
</html>
