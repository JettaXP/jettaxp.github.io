<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | JettaX</title>
    <meta name="description" content="Страница не найдена на сайте JettaX.">
    <link rel="icon" href="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/404/style.css">
</head>
<body>
    <script>
        (function () {
            const ua = navigator.userAgent;
            const platform = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
            const touchMac = /mac/i.test(platform) && navigator.maxTouchPoints > 1;
            const path = location.pathname.replace(/\/+$/, '').toLowerCase();
            let device = 'linux';
            if (path.endsWith('/windows')) device = 'android';
            else if (path.endsWith('/fluid')) device = 'fluid';
            else if (path.endsWith('/macos')) device = 'macos';
            else if (path.endsWith('/ios')) device = 'ios';
            else if (path.endsWith('/ipados')) device = 'ipados';
            else if (path.endsWith('/linux')) device = 'linux';
            else if (path.endsWith('/material')) device = 'windows';
            else if (/android/i.test(ua)) device = 'android';
            else if (/ipad/i.test(ua) || touchMac) device = 'ipados';
            else if (/iphone|ipod/i.test(ua)) device = 'ios';
            else if (/macintosh|mac os x/i.test(ua)) device = 'macos';
            else if (/win/i.test(platform) || /windows/i.test(ua)) device = 'windows';
            document.body.dataset.device = device;
        })();
    </script>
    <main class="page-shell" aria-labelledby="page-title">
        <div class="orb-layer" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="orb orb-three"></span>
            <span class="orb orb-four"></span>
            <span class="orb orb-five"></span>
            <span class="orb orb-six"></span>
        </div>

        <section class="container">
            <div class="error-code" aria-label="Ошибка 404">
                <span class="digit">4</span>
                <div class="zero-container" aria-hidden="true">
                    <div class="avatar-mask">
                        <img src="https://raw.githubusercontent.com/JettaXP/pix/jettax.xyz/jettax.png" alt="">
                        <span class="material-symbols-outlined fallback-icon">question_mark</span>
                    </div>
                </div>
                <span class="digit">4</span>
            </div>

            <h1 id="page-title">Страница не найдена</h1>
            <p class="message">Такой страницы нет. Зато есть повод вернуться на главную и сделать вид, что этого перехода не было.</p>

            <div class="actions">
                <a href="/" class="cta-button">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                    Вернуться на главную
                </a>
            </div>
        </section>
    </main>
    <div id="linux-tty-overlay" aria-hidden="true">
        <div id="tty-content"></div>
    </div>
    <div id="rickroll-player" aria-hidden="true"></div>

    <script>
        const container = document.querySelector('.container');
        const player = document.getElementById('rickroll-player');
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
        let draggedOrb = null;
        const orbs = [...document.querySelectorAll('.orb')].map((node, index) => ({
            node,
            x: 120 + index * 150,
            y: 120 + (index % 3) * 55,
            vx: (index % 2 ? -1 : 1) * (1.6 + index * 0.18),
            vy: 0,
            radius: 100,
            index,
            dragOffsetX: 0,
            dragOffsetY: 0,
            lastX: 0,
            lastY: 0
        }));

        const clampOrbs = () => {
            orbs.forEach((orb) => {
                orb.radius = orb.node.getBoundingClientRect().width / 2;
                orb.x = Math.min(Math.max(orb.x, orb.radius), window.innerWidth - orb.radius);
                orb.y = Math.min(Math.max(orb.y, orb.radius), window.innerHeight - orb.radius);
            });
        };

        const startRickroll = () => {
            if (document.body.dataset.device === 'linux') return;
            if (player.firstChild) return;
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&playsinline=1&rel=0';
            iframe.title = 'Rickroll audio';
            iframe.allow = 'autoplay; encrypted-media';
            player.appendChild(iframe);
        };

        if (document.body.dataset.device === 'android') {
            document.addEventListener('click', (event) => {
                if (document.body.dataset.device === 'linux') return;
                if (!container.contains(event.target)) startRickroll();
            });
        } else {
        document.addEventListener('mousemove', (event) => {
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            pointer.active = true;

            if (draggedOrb) {
                const nextX = event.clientX + draggedOrb.dragOffsetX;
                const nextY = event.clientY + draggedOrb.dragOffsetY;
                draggedOrb.vx = (nextX - draggedOrb.lastX) * 0.7;
                draggedOrb.vy = (nextY - draggedOrb.lastY) * 0.7;
                draggedOrb.x = nextX;
                draggedOrb.y = nextY;
                draggedOrb.lastX = nextX;
                draggedOrb.lastY = nextY;
            }

            const xAxis = (window.innerWidth / 2 - event.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - event.pageY) / 25;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            pointer.active = false;
            container.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        document.addEventListener('click', (event) => {
            if (document.body.dataset.device === 'linux') return;
            orbs.forEach((orb) => {
                const dx = orb.x - event.clientX;
                const dy = orb.y - event.clientY;
                const distance = Math.hypot(dx, dy) || 1;
                const force = Math.max(0.35, 1 - distance / 900);
                orb.vx += (dx / distance) * (8 + force * 16);
                orb.vy -= 22 + force * 18;
                orb.node.classList.add('is-jumping');
                window.setTimeout(() => orb.node.classList.remove('is-jumping'), 360);
            });

            if (!container.contains(event.target) && !event.target.closest('.orb')) {
                startRickroll();
            }
        });

        orbs.forEach((orb) => {
            orb.node.addEventListener('mousedown', (event) => {
                event.preventDefault();
                draggedOrb = orb;
                pointer.active = true;
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                orb.dragOffsetX = orb.x - event.clientX;
                orb.dragOffsetY = orb.y - event.clientY;
                orb.lastX = orb.x;
                orb.lastY = orb.y;
                orb.vx = 0;
                orb.vy = 0;
                orb.node.classList.add('is-dragged');
            });
        });

        document.addEventListener('mouseup', () => {
            if (!draggedOrb) return;
            draggedOrb.node.classList.remove('is-dragged');
            draggedOrb = null;
        });

        const animate = () => {
            orbs.forEach((orb) => {
                if (orb === draggedOrb) return;

                orb.vy += 0.72;

                if (pointer.active) {
                    const dx = orb.x - pointer.x;
                    const dy = orb.y - pointer.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const repelRadius = orb.radius + 180;
                    if (distance < repelRadius) {
                        const force = (1 - distance / repelRadius) * 4.2;
                        orb.vx += (dx / distance) * force;
                        orb.vy += (dy / distance) * force;
                    }
                }
            });

            for (let i = 0; i < orbs.length; i += 1) {
                for (let j = i + 1; j < orbs.length; j += 1) {
                    const a = orbs[i];
                    const b = orbs[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy) || 1;
                    const minDistance = a.radius + b.radius + 10;
                    if (distance < minDistance) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const overlap = (minDistance - distance) / 2;
                        a.x -= nx * overlap;
                        a.y -= ny * overlap;
                        b.x += nx * overlap;
                        b.y += ny * overlap;

                        const relativeVelocity = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                        const impulse = Math.max(0.5, -relativeVelocity * 0.62);
                        a.vx -= nx * impulse;
                        a.vy -= ny * impulse;
                        b.vx += nx * impulse;
                        b.vy += ny * impulse;
                    }
                }
            }

            orbs.forEach((orb) => {
                if (orb === draggedOrb) {
                    orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
                    return;
                }

                orb.vx *= 0.992;
                orb.vy *= 0.992;
                orb.x += orb.vx;
                orb.y += orb.vy;

                const minX = orb.radius;
                const maxX = window.innerWidth - orb.radius;
                const minY = orb.radius;
                const maxY = window.innerHeight - orb.radius;

                if (orb.x < minX || orb.x > maxX) {
                    orb.x = Math.min(Math.max(orb.x, minX), maxX);
                    orb.vx *= -0.72;
                }

                if (orb.y < minY || orb.y > maxY) {
                    orb.y = Math.min(Math.max(orb.y, minY), maxY);
                    orb.vy *= -0.64;
                    orb.vx *= 0.965;
                }

                orb.node.style.transform = `translate3d(${orb.x - orb.radius}px, ${orb.y - orb.radius}px, 0)`;
            });

            requestAnimationFrame(animate);
        };

        window.addEventListener('resize', clampOrbs);
        clampOrbs();
        animate();
        }
    </script>

    <script>
        if (document.body.dataset.device === 'linux') { // ensure no floating ee windows
            const _s = document.createElement('style'); _s.textContent = '.ee-zone, .ee-overlay, .ee-window, .blob { display:none !important; }'; document.head.appendChild(_s);
            const tty = document.getElementById('tty-content');
            let step = 0;
            const lines = [
                'EndeavourOS 7.0.8-arch1-1 (tty3)',
                '',
                'pixel login: jettax',
                'Password: ',
                '<span class="tty-blue">jettax</span><span class="tty-mauve">@pixel</span> <span class="tty-green">~$</span> bash 404.sh'
            ];
            
            const ascii404 = `  _  _    ___   _  _  
 | || |  / _ \\ | || | 
 | || |_| | | || || |_ 
 |__   _| |_| ||__   _|
    |_|  \\___/    |_|  

<span class="tty-muted">Такой страницы нет. Зато есть повод вернуться на главную и сделать вид, что этого перехода не было.
Press Enter to return to main...</span>`;

            let currentHtml = '';
            
            const typeText = (text, callback) => {
                let i = 0;
                const typing = setInterval(() => {
                    tty.innerHTML = currentHtml + text.substring(0, i) + '<span class="tty-cursor"></span>';
                    i++;
                    if (i > text.length) {
                        clearInterval(typing);
                        currentHtml += text + '<br>';
                        tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                        callback();
                    }
                }, 50);
            };

            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && currentHtml.includes('Press Enter to return to main')) {
                    location.href = '/';
                }
            });
            const runTty = () => {
                currentHtml += lines[0] + '<br><br>';
                tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                
                setTimeout(() => {
                    currentHtml += 'pixel login: ';
                    typeText('jettax', () => {
                        setTimeout(() => {
                            currentHtml += 'Password: ';
                            tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                            setTimeout(() => {
                                currentHtml += '<br>';
                                currentHtml += '<span class="tty-blue">jettax</span><span class="tty-mauve">@pixel</span> <span class="tty-green">~$</span> ';
                                typeText('bash 404.sh', () => {
                                    setTimeout(() => {
                                        currentHtml = '<div class="tty-ascii">' + ascii404 + '</div><br><span class="tty-blue">jettax</span><span class="tty-mauve">@pixel</span> <span class="tty-green">~$</span> ';
                                        tty.innerHTML = currentHtml + '<span class="tty-cursor"></span>';
                                    }, 800);
                                });
                            }, 2500);
                        }, 500);
                    });
                }, 500);
            };
            
            setTimeout(runTty, 500);
        }
    </script>
</body>
