<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💀💀💀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a2e;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Impact', 'Arial Black', sans-serif;
  }
  body.shaking {
    animation: earthquake 0.1s linear infinite;
  }
  @keyframes earthquake {
    0% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-8px, -6px) rotate(-1deg); }
    20% { transform: translate(6px, 8px) rotate(1deg); }
    30% { transform: translate(-10px, 4px) rotate(0.5deg); }
    40% { transform: translate(8px, -8px) rotate(-0.5deg); }
    50% { transform: translate(-4px, 10px) rotate(1deg); }
    60% { transform: translate(10px, -4px) rotate(-1deg); }
    70% { transform: translate(-6px, -10px) rotate(0.5deg); }
    80% { transform: translate(4px, 6px) rotate(-0.5deg); }
    90% { transform: translate(-8px, 8px) rotate(1deg); }
    100% { transform: translate(6px, -6px) rotate(0deg); }
  }
  #prompt {
    font-size: clamp(32px, 7vw, 80px);
    color: #ff4444;
    z-index: 10;
    text-align: center;
    text-shadow: 0 0 20px #ff0000, 0 0 60px #ff0000;
    animation: warningPulse 0.8s ease-in-out infinite alternate;
    padding: 20px;
  }
  @keyframes warningPulse {
    0% { transform: scale(1); color: #ff4444; }
    100% { transform: scale(1.08); color: #ff0000; }
  }
  #subtext {
    font-size: clamp(14px, 2.5vw, 26px);
    color: #ff8888;
    z-index: 10;
    margin-top: 12px;
    animation: flickerText 0.3s infinite;
  }
  @keyframes flickerText {
    0%, 50% { opacity: 1; }
    25%, 75% { opacity: 0.4; }
  }
  #warningIcon {
    font-size: clamp(60px, 15vw, 150px);
    z-index: 10;
    margin-bottom: 20px;
    animation: wobble 1s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  /* Flash overlay */
  #flashOverlay {
    position: fixed;
    top: -20px; left: -20px;
    width: calc(100% + 40px);
    height: calc(100% + 40px);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
  }
  #flashOverlay.active {
    animation: colorFlash 0.3s linear infinite;
    opacity: 0.3;
  }
  @keyframes colorFlash {
    0% { background: #ff0000; }
    14% { background: #ff8800; }
    28% { background: #ffff00; }
    42% { background: #00ff00; }
    57% { background: #0088ff; }
    71% { background: #8800ff; }
    85% { background: #ff00ff; }
    100% { background: #ff0000; }
  }
  /* Crack effect */
  #cracks {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    background-image:
      linear-gradient(45deg, transparent 48%, #ff000088 48%, #ff000088 52%, transparent 52%),
      linear-gradient(-30deg, transparent 46%, #ff440088 46%, #ff440088 54%, transparent 54%),
      linear-gradient(70deg, transparent 49%, #ff000066 49%, #ff000066 51%, transparent 51%),
      linear-gradient(-60deg, transparent 47%, #ff880066 47%, #ff880066 53%, transparent 53%);
    background-size: 100% 100%;
  }
  #cracks.show { opacity: 1; }
  /* After text */
  #afterText {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(24px, 5vw, 64px);
    color: #fff;
    z-index: 15;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff4400, 4px 4px 0 #000;
    line-height: 1.4;
  }
  #afterText.show {
    opacity: 1;
    animation: shakeText 0.15s linear infinite;
  }
  @keyframes shakeText {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    25% { transform: translate(calc(-50% + 3px), calc(-50% - 3px)) rotate(1deg); }
    50% { transform: translate(calc(-50% - 3px), calc(-50% + 3px)) rotate(-1deg); }
    75% { transform: translate(calc(-50% + 2px), calc(-50% + 2px)) rotate(0.5deg); }
    100% { transform: translate(calc(-50% - 2px), calc(-50% - 2px)) rotate(-0.5deg); }
  }
  /* Bouncing emoji */
  .bounceEmoji {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    font-size: 40px;
  }
  /* Edge warning stripes */
  #warningStripes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    border: 12px solid transparent;
    border-image: repeating-linear-gradient(
      45deg, #ff0000, #ff0000 20px, #ffaa00 20px, #ffaa00 40px
    ) 12;
    animation: warningBlink 0.5s infinite alternate;
  }
  #warningStripes.show { opacity: 1; }
  @keyframes warningBlink {
    0% { border-image: repeating-linear-gradient(45deg, #ff0000, #ff0000 20px, #ffaa00 20px, #ffaa00 40px) 12; }
    100% { border-image: repeating-linear-gradient(45deg, #ffaa00, #ffaa00 20px, #ff0000 20px, #ff0000 40px) 12; }
  }
  /* Big skull */
  #bigSkull {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(100px, 30vw, 300px);
    z-index: 4;
    opacity: 0.3;
    transition: transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    filter: drop-shadow(0 0 40px #ff0000);
  }
  #bigSkull.show {
    transform: translate(-50%, -50%) scale(1);
    animation: skullPulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes skullPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.4; }
  }
</style>
</head>
<body>
  <div id="warningIcon">⚠️</div>
  <div id="prompt">Нажми на экран 😏</div>
  <div id="subtext">⚠️ ОПАСНО ⚠️</div>
  <div id="flashOverlay"></div>
  <div id="cracks"></div>
  <div id="bigSkull">💀</div>
  <div id="afterText">RICKROLLED!<br>🤣😂💀🤣😂💀</div>
  <div id="warningStripes"></div>

  <div id="player" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '1', width: '1',
        videoId: 'dQw4w9WgXcQ',
        playerVars: { autoplay: 0, controls: 0 },
        events: { 'onReady': function(){} }
      });
    }

    let started = false;
    const emojis = ['😂','🤣','💀','😈','🔥','👻','⚡','💥','🫠','😭','🤡','☠️','🥵','😱','🎵','🎶','👾'];

    class BouncingEmoji {
      constructor() {
        this.el = document.createElement('div');
        this.el.className = 'bounceEmoji';
        this.el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        this.size = 25 + Math.random() * 55;
        this.el.style.fontSize = this.size + 'px';
        this.x = Math.random() * (window.innerWidth - 60);
        this.y = Math.random() * (window.innerHeight - 60);
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.rotation = 0;
        this.rotSpeed = (Math.random() - 0.5) * 20;
        document.body.appendChild(this.el);
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x <= 0 || this.x >= window.innerWidth - this.size) {
          this.vx *= -1.02;
          this.x = Math.max(0, Math.min(this.x, window.innerWidth - this.size));
          // Random speed boost
          this.vy += (Math.random() - 0.5) * 3;
        }
        if (this.y <= 0 || this.y >= window.innerHeight - this.size) {
          this.vy *= -1.02;
          this.y = Math.max(0, Math.min(this.y, window.innerHeight - this.size));
          this.vx += (Math.random() - 0.5) * 3;
        }

        // Clamp velocity
        const maxV = 18;
        this.vx = Math.max(-maxV, Math.min(maxV, this.vx));
        this.vy = Math.max(-maxV, Math.min(maxV, this.vy));

        this.rotation += this.rotSpeed;
        this.el.style.left = this.x + 'px';
        this.el.style.top = this.y + 'px';
        this.el.style.transform = `rotate(${this.rotation}deg)`;
      }
    }

    let bouncers = [];

    function spawnBouncers() {
      const count = Math.min(50, Math.floor(window.innerWidth * window.innerHeight / 15000));
      for (let i = 0; i < count; i++) {
        setTimeout(() => bouncers.push(new BouncingEmoji()), i * 50);
      }
    }

    function updateBouncers() {
      bouncers.forEach(b => b.update());
      if (started) requestAnimationFrame(updateBouncers);
    }

    // Random screen flash (brief white flash)
    function doFlash() {
      if (!started) return;
      const flash = document.createElement('div');
      flash.style.cssText = `
        position:fixed; top:-20px; left:-20px;
        width:calc(100% + 40px); height:calc(100% + 40px);
        background:white; z-index:100;
        pointer-events:none; opacity:0.8;
      `;
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 80);
      setTimeout(doFlash, 2000 + Math.random() * 4000);
    }

    // Spawn explosion bursts
    function explosion() {
      if (!started) return;
      const cx = Math.random() * window.innerWidth;
      const cy = Math.random() * window.innerHeight;
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const angle = (i / 8) * Math.PI * 2;
        const dist = 80 + Math.random() * 120;
        el.style.cssText = `
          position:fixed;
          font-size:${30+Math.random()*30}px;
          left:${cx}px; top:${cy}px;
          z-index:20;
          pointer-events:none;
          transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        `;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
          el.style.left = (cx + Math.cos(angle) * dist) + 'px';
          el.style.top = (cy + Math.sin(angle) * dist) + 'px';
          el.style.opacity = '0';
          el.style.transform = `scale(2) rotate(${Math.random()*360}deg)`;
        });
        setTimeout(() => el.remove(), 700);
      }
      setTimeout(explosion, 800 + Math.random() * 1500);
    }

    document.body.addEventListener('click', function handler() {
      if (started) return;
      started = true;

      // Hide prompt elements
      document.getElementById('prompt').style.display = 'none';
      document.getElementById('subtext').style.display = 'none';
      document.getElementById('warningIcon').style.display = 'none';

      // Activate effects
      document.body.classList.add('shaking');
      document.getElementById('flashOverlay').classList.add('active');
      document.getElementById('cracks').classList.add('show');
      document.getElementById('bigSkull').classList.add('show');
      document.getElementById('afterText').classList.add('show');
      document.getElementById('warningStripes').classList.add('show');

      // Play music
      if (player && player.playVideo) player.playVideo();

      // Launch effects
      spawnBouncers();
      updateBouncers();
      setTimeout(doFlash, 1500);
      setTimeout(explosion, 500);

      // Add more bouncers over time
      let addCount = 0;
      const addMore = setInterval(() => {
        if (addCount++ > 10) { clearInterval(addMore); return; }
        bouncers.push(new BouncingEmoji());
        bouncers.push(new BouncingEmoji());
      }, 2000);

      document.body.removeEventListener('click', handler);
    });
  </script>
</body>
</html>
