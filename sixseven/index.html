<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #prompt {
    font-size: clamp(28px, 6vw, 72px);
    text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 80px #008f11;
    z-index: 10;
    text-align: center;
    animation: glitch 2s infinite;
    padding: 20px;
  }
  #subtext {
    font-size: clamp(14px, 2.5vw, 28px);
    color: #00aa30;
    margin-top: 15px;
    z-index: 10;
    opacity: 0.8;
    animation: blink 1.2s infinite;
  }
  #bigEmoji {
    font-size: clamp(80px, 20vw, 200px);
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 5;
    filter: drop-shadow(0 0 30px #00ff41);
    transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  #bigEmoji.show {
    transform: translate(-50%, -50%) scale(1);
    animation: pulseEmoji 1s ease-in-out infinite;
  }
  #afterText {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(18px, 3.5vw, 40px);
    color: #00ff41;
    z-index: 15;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s;
    text-shadow: 0 0 15px #00ff41;
    white-space: nowrap;
  }
  #afterText.show { opacity: 1; animation: textGlitch 3s infinite; }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }
  /* Matrix scanline overlay */
  #scanline {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
  }
  #scanline.show { opacity: 1; }

  @keyframes glitch {
    0%, 90%, 100% { transform: translate(0); }
    92% { transform: translate(-5px, 2px); }
    94% { transform: translate(5px, -2px); }
    96% { transform: translate(-3px, -1px); }
    98% { transform: translate(3px, 1px); }
  }
  @keyframes blink {
    0%, 49% { opacity: 0.8; }
    50%, 100% { opacity: 0.2; }
  }
  @keyframes pulseEmoji {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }
  @keyframes textGlitch {
    0%, 85%, 100% { transform: translateX(-50%) skewX(0deg); }
    87% { transform: translateX(-50%) skewX(5deg); color: #ff0040; }
    89% { transform: translateX(-50%) skewX(-3deg); color: #00ff41; }
    91% { transform: translateX(-50%) skewX(2deg); }
  }
</style>
</head>
<body>
  <div id="prompt">Нажми на экран 😏</div>
  <div id="subtext">[ system breach imminent... ]</div>
  <div id="bigEmoji">😂</div>
  <div id="afterText">Never Gonna Give You Up 💀🤣😂</div>
  <canvas id="matrix"></canvas>
  <div id="scanline"></div>

  <div id="player" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '1', width: '1',
        videoId: 'dQw4w9WgXcQ',
        playerVars: { autoplay: 0, controls: 0 },
        events: { 'onReady': function(){} }
      });
    }

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let started = false;
    let columns = [];
    const emojis = ['😂','🤣','💀','😏','🔥','👻','💚','🐸','👾','😈','🎵','🎶','✨','⚡','🫠','😭','🤡'];
    const fontSize = 22;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const cols = Math.floor(canvas.width / fontSize);
      columns = [];
      for (let i = 0; i < cols; i++) {
        columns.push({ y: Math.random() * canvas.height, speed: 0.5 + Math.random() * 1.5 });
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < columns.length; i++) {
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        const x = i * fontSize;
        const y = columns[i].y;

        // Bright head
        ctx.fillStyle = '#00ff41';
        ctx.globalAlpha = 1;
        ctx.fillText(emoji, x, y);

        // Trail
        ctx.fillStyle = '#008f11';
        ctx.globalAlpha = 0.5;
        ctx.fillText(emojis[Math.floor(Math.random() * emojis.length)], x, y - fontSize);

        columns[i].y += fontSize * columns[i].speed;

        if (columns[i].y > canvas.height && Math.random() > 0.98) {
          columns[i].y = 0;
          columns[i].speed = 0.5 + Math.random() * 1.5;
        }
      }
      ctx.globalAlpha = 1;
      if (started) requestAnimationFrame(drawMatrix);
    }

    // Floating side emojis
    function spawnFloat() {
      if (!started) return;
      const el = document.createElement('div');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.cssText = `
        position:fixed;
        font-size:${30 + Math.random()*40}px;
        left:${Math.random()*100}vw;
        top:-50px;
        z-index:3;
        pointer-events:none;
        opacity:0.7;
        animation: floatDown ${3+Math.random()*4}s linear forwards;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 7000);
      setTimeout(spawnFloat, 100 + Math.random()*200);
    }

    // Add float animation
    const floatStyle = document.createElement('style');
    floatStyle.textContent = `
      @keyframes floatDown {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
      }
    `;
    document.head.appendChild(floatStyle);

    document.body.addEventListener('click', function handler() {
      if (started) return;
      started = true;

      // Hide prompt
      document.getElementById('prompt').style.display = 'none';
      document.getElementById('subtext').style.display = 'none';

      // Show elements
      document.getElementById('bigEmoji').classList.add('show');
      document.getElementById('afterText').classList.add('show');
      document.getElementById('scanline').classList.add('show');

      // Start music
      if (player && player.playVideo) player.playVideo();

      // Start matrix rain
      drawMatrix();

      // Start floating emojis
      spawnFloat();

      document.body.removeEventListener('click', handler);
    });
  </script>
</body>
</html>
