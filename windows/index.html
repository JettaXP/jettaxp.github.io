<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JettaX | Windows</title>
</head>
<body>
  <script>
    fetch('/index.html', { cache: 'no-cache' })
      .then(response => response.text())
      .then(html => {
        html = html.replace('<head>', '<head><base href="/">');
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</body>
</html>
