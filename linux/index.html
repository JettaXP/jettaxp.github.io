<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JettaX | Linux (TTY Bio)</title>
  <style>
    body{background:#000;color:#cdd6f4;font-family:monospace;padding:20px}
    .tty{max-width:1000px;margin:20px auto;background:#060606;border-radius:8px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
    .tty pre{white-space:pre-wrap;word-break:break-word;font-family:inherit}
    .tty .prompt{color:#89b4fa}
    .links{margin-top:12px}
    .link-btn{display:inline-block;margin:6px 6px;padding:6px 10px;background:#0b0c0d;border:1px solid rgba(255,255,255,0.04);color:var(--fg);border-radius:6px;text-decoration:none}
    .note{color:#7c8598;font-size:13px;margin-top:10px}
    .ascii{color:#cba6f7;white-space:pre;font-family:inherit}
    .tty-cursor{display:inline-block;width:8px;height:1em;background:#cdd6f4;vertical-align:bottom;animation:blink 1s steps(2,end) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
</head>
<body>
  <div class="tty" id="tty">
    <pre id="tty-content">EndeavourOS 7.0.8-arch1-1 (tty3)

pixel login: </pre>
  </div>

  <script>
    // TTY bio emulation (based on 404 TTY)
    const tty = document.getElementById('tty-content');
    const links = [
      {k:'1',t:'Telegram',u:'https://t.me/jettaxp'},
      {k:'2',t:'GitHub',u:'https://github.com/JettaXP'},
      {k:'3',t:'Last.fm',u:'https://www.last.fm/user/JettaXP'},
      {k:'4',t:'Steam',u:'https://steamcommunity.com/id/jettaxp'},
      {k:'5',t:'Clash Royale',u:'https://link.clashroyale.com/invite/friend/ru/?tag=QCVVRCQ99&token=4a37sybn&platform=android'}
    ];

    function typeText(target, text, speed=60){ return new Promise(res=>{ let i=0; const iv=setInterval(()=>{ target.innerHTML += text.charAt(i++); target.scrollTop = target.scrollHeight; if(i>text.length-1){ clearInterval(iv); res(); } }, speed); }); }

    async function run(){
      // type login
      await typeText(tty, 'jettax');
      await new Promise(r=>setTimeout(r,400));
      tty.innerHTML += '\nPassword: ';
      // fake password typing
      await typeText(tty, '********', 120);
      await new Promise(r=>setTimeout(r,600));
      tty.innerHTML += '\n\n<span class="prompt">jettax@pixel:~$</span> bash jettax.xyz/linux/bio.sh\n';
      await new Promise(r=>setTimeout(r,700));

      // show ascii bio (canonical style)
      const ascii = `  _  _    ___   _  _  \n | || |  / _ \\ | || | \n | || |_| | | || || |_ \n |__   _| |_| ||__   _|\n    |_|  \\___/    |_|  \n`;
      tty.innerHTML += '<div class="ascii">' + ascii + '</div>\n';

      // show TTY bio content
      tty.innerHTML += '\nWelcome to my bio!\n';
      tty.innerHTML += 'Я — Philipp, живу в Днепре, Украина.\n';
      tty.innerHTML += 'Последний трек: (подключается Last.fm)\n\n';

      // brief links (numbered)
      tty.innerHTML += 'Links (press number to open):\n';
      links.forEach(l=>{ tty.innerHTML += `[${l.k}] ${l.t} — ${l.u}\n`; });

      tty.innerHTML += '\nPress Enter to return to main...\n';
      // attach key handler
      window.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') location.href = '/';
        if(['1','2','3','4','5'].includes(e.key)){
          const item = links.find(x=>x.k===e.key); if(item) window.open(item.u, '_blank');
        }
      });
    }

    setTimeout(run, 600);
  </script>
</body>
</html>
