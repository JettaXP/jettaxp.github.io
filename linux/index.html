async function sendToAI(text){
  chatHistory.push({role:'user',content:text}); 
  append('... thinking\n'); 
  try{ 
    const r=await fetch(_baseUrl + '/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_k()},body:JSON.stringify({model:'pplx-gpt-5.1',messages:chatHistory})}); 
    const data=await r.json().catch(()=>({})); 
    let textResp = data.choices && data.choices.length ? (data.choices[0].message?.content||data.choices[0].text) : data.error?.message || ('http '+r.status); 
    append('AI: '+textResp+'\n'); 
    chatHistory.push({role:'assistant',content:textResp}); 
  }catch(e){ 
    append('ошибка: '+(e?.message||e)+'\n'); 
  } 
}

function showPrompt() {
  const promptText = isAiMode 
    ? '<span class="blue">ai</span><span class="accent">@pixel</span> <span class="green">~$</span> '
    : '<span class="blue">jettax</span><span class="accent">@pixel</span> <span class="green">~$</span> ';
    
  append('\n' + promptText + '<input id="cmd-input" autocomplete="off" spellcheck="false" autofocus style="background:transparent;border:none;color:#cdd6f4;font-family:inherit;font-size:inherit;outline:none;width:60%;caret-color:#cdd6f4;" />');
  const cmdInput = document.getElementById('cmd-input');
  cmdInput.focus();
  
  const clickHandler = () => { if(cmdInput) cmdInput.focus(); };
  document.addEventListener('click', clickHandler);

  cmdInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const val = cmdInput.value.trim();
      cmdInput.outerHTML = val; 
      document.removeEventListener('click', clickHandler);
      append('\n');
      
      if (isAiMode) {
         if (val === '/exit' || val === 'exit') {
            isAiMode = false;
            append('Выход из AI режима...\n');
            showPrompt();
         } else if (val === 'clear') {
            screen.innerHTML = '';
            showPrompt();
         } else if (val !== '') {
            await sendToAI(val);
            showPrompt();
         } else {
            showPrompt();
         }
         return;
      }

      if (val === 'clear') {
        screen.innerHTML = '';
      } else if (val === 'ai' || val === './ai') {
        append('Запуск нейронки (AI Mode). Напиши /exit чтобы выйти.\n');
        isAiMode = true;
      } else if (val === 'cat bio.txt') {
        await printBio();
      } else if (val === 'bash 404.sh') {
        append(ascii404 + '\n');
      } else if (val === 'fastfetch') {
        append(fastfetch() + '\n');
      } else if (val === 'ls' || val === 'ls ~' || val === 'ls /home/jettax') {
        append('404.sh  ai  bio.txt  Desktop  Documents  Downloads  jettaxp.github.io  Music  Pictures  Public  Templates  Videos\n');
      } else if (val === 'ls /' || val === 'ls / ') {
        append('bin  boot  dev  etc  home  lib  lib64  mnt  opt  proc  root  run  sbin  srv  sys  tmp  usr  var\n');
      } else if (val === 'help') {
        append('Доступные команды:\n  clear       - очистить терминал\n  ai          - запустить AI прямо здесь\n  cat bio.txt - показать информацию\n  fastfetch   - показать инфу о системе\n  bash 404.sh - показать 404 ошибку\n  ls          - показать файлы\n  help        - показать это сообщение\n');
      } else if (val !== '') {
        append('bash: ' + val + ': команда не найдена\n');
      }
      showPrompt();
    }
  });
}

}
