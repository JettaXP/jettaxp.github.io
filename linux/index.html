<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JettaX | Linux (TTY)</title>
<style>
  body{background:#000;color:#cdd6f4;font-family: 'JetBrains Mono', monospace;margin:0;height:100vh}
  .term{padding:10px;box-sizing:border-box;height:100%;width:100%}
  #screen{max-width:980px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:16px}
  .prompt{color:#89b4fa}
  .muted{color:#7c8598}
  .accent{color:#cba6f7}
  .green{color:#a6e3a1}
  .peach{color:#fab387}
  .red{color:#f38ba8}
  .yellow{color:#f9e2af}
  .blue{color:#89b4fa}
  .teal{color:#94e2d5}
  .tty-cursor{display:inline-block;width:8px;height:1em;background:#cdd6f4;vertical-align:bottom;animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}
  a{color:#89b4fa;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="term">
    <pre id="screen">EndeavourOS 7.0.8-arch1-1 (tty3)

pixel login: </pre>
  </div>
<script>
const screen = document.getElementById('screen');

const links = [
  {k:'1',t:'Telegram',u:'https://t.me/jettaxp',s:'@jettaxp'},
  {k:'2',t:'TikTok',u:'https://www.tiktok.com/@jettax03',s:'@jettax03'},
  {k:'3',t:'Steam',u:'https://steamcommunity.com/id/jettax',s:'jettaxp'},
  {k:'4',t:'GitHub',u:'https://github.com/JettaXP',s:'jettaxp'},
  {k:'5',t:'Clash Royale',u:'https://link.clashroyale.com/invite/friend/ru/?tag=QCVVRCQ99&token=4a37sybn&platform=android',s:'JettaXGG'},
  {k:'6',t:'Brawl Stars',u:'https://link.brawlstars.com/invite/friend/ru?tag=PQPCUPRQP&token=8dphjwnw',s:'JettaXGG'},
  {k:'7',t:'Last.fm',u:'https://www.last.fm/user/JettaXP',s:'JettaXP'}
];

function append(text){ screen.insertAdjacentHTML('beforeend', text); window.scrollTo(0,document.body.scrollHeight); }
function typeText(text, speed=45){ return new Promise(res=>{ let i=0; const t=setInterval(()=>{ append(text.charAt(i++)); if(i>text.length-1){ clearInterval(t); res(); } }, speed); }); }

async function printBio(){
  // === About ===
  append('\n<span class="accent">═══ About ═══</span>\n');
  append('Name:      <span class="green">Филипп (Philipp)</span>\n');
  append('Nicknames: <span class="green">jettax, jettaxp</span>\n');
  append('Location:  <span class="green">Днепр, Украина</span>\n');
  append('Birthday:  <span class="green">10 ноября</span>\n');
  append('About:     <span class="green">Делаю всякую дичь в фигме</span>\n');

  // === Now Playing ===
  append('\n<span class="accent">═══ Now Playing ═══</span>\n');
  try{
    const LASTFM_API = 'https://ws.audioscrobbler.com/2.0/';
    const LASTFM_KEY = '9456ce29b8b500ab019e56d2b1ccab1f';
    const LASTFM_USER = 'JettaXP';
    const res = await fetch(`${LASTFM_API}?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_KEY}&format=json&limit=1`);
    const d = await res.json();
    const track = d?.recenttracks?.track?.[0];
    if(track){
      const now = track['@attr'] && track['@attr'].nowplaying ? 'Сейчас играет' : 'Последний трек';
      const name = track.name || '—';
      const artist = track.artist?.['#text'] || '—';
      append(`<span class="peach">${now}:</span> ${name} — ${artist}\n`);
    } else append('<span class="muted">Последний трек: —</span>\n');
  }catch(e){ append('<span class="muted">Последний трек: —</span>\n'); }

  // === Links ===
  append('\n<span class="accent">═══ Links ═══</span>\n');
  links.forEach(l=>{
    append(`[<span class="yellow">${l.k}</span>] <a href="${l.u}" target="_blank">${l.t}</a> — ${l.s}\n`);
  });
  append('    <span class="muted">Discord — jettax03</span>\n');
  append('    <span class="muted">Epic Games — JettaXP</span>\n');

  // === Devices ===
  append('\n<span class="accent">═══ Devices ═══</span>\n');
  append('<span class="yellow">Телефоны:</span>\n');
  append('  Huawei INE-LX1       <span class="green">[основной]</span>\n');
  append('  Samsung Galaxy S20FE  <span class="red">[сломан экран]</span>\n');
  append('  Pixel 7a              <span class="red">[rip battery]</span>\n');
  append('  Redmi 8               <span class="green">[working]</span>\n');
  append('<span class="yellow">ПК:</span>\n');
  append('  Intel Core i3-10105F @ 3.70GHz\n');
  append('  NVIDIA GTX 950\n');
  append('  16GB DDR4\n');
  append('<span class="yellow">Ноутбук:</span>\n');
  append('  Asus Vivobook S 15\n');
  append('<span class="yellow">Дополнительно:</span>\n');
  append('  Pixel Watch 1\n');
  append('  Pixel Buds A-series\n');

  // === Pets ===
  append('\n<span class="accent">═══ Мои питомцы ═══</span>\n');
  append('  Lukas   — шпиц  · 1 год  · 31 июля\n');
  append('  Umka    — шпиц  · 1 год  · 31 июля\n');
  append('  Vishnya — шпиц  · 1 год  · 31 июля\n');
  append('  Jetta   — помчи · 5 лет  · 8 февраля\n');
}

function showPrompt() {
  append('\n<span class="blue">jettax</span><span class="accent">@pixel</span> <span class="green">~$</span> <input id="cmd-input" autocomplete="off" spellcheck="false" autofocus style="background:transparent;border:none;color:#cdd6f4;font-family:inherit;font-size:inherit;outline:none;width:60%;caret-color:#cdd6f4;" />');
  const cmdInput = document.getElementById('cmd-input');
  cmdInput.focus();
  
  const clickHandler = () => { if(cmdInput) cmdInput.focus(); };
  document.addEventListener('click', clickHandler);

  cmdInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const val = cmdInput.value.trim();
      cmdInput.outerHTML = val; // lock in text
      document.removeEventListener('click', clickHandler);
      append('\n');
      
      if (val === 'clear') {
        screen.innerHTML = '';
      } else if (val === 'ai' || val === '/ai' || val === './ai') {
        append('Запуск нейронки...\n');
        setTimeout(() => location.href = '/ai/linux', 500);
        return;
      } else if (val === 'cat bio.txt') {
        await printBio();
      } else if (val === 'help') {
        append('Доступные команды:\n  clear       - очистить терминал\n  ai          - запустить AI версию\n  cat bio.txt - показать информацию\n  help        - показать это сообщение\n');
      } else if (val !== '') {
        append('bash: ' + val + ': команда не найдена\n');
      }
      showPrompt();
    }
  });
}

async function runTTY(){
  await typeText('jettax');
  await new Promise(r=>setTimeout(r,400));
  append('\nPassword: ');
  await new Promise(r=>setTimeout(r,2500));
  append('\n\n');

  // prompt
  append('<span class="blue">jettax</span><span class="accent">@pixel</span> <span class="green">~$</span> cat bio.txt\n');
  await new Promise(r=>setTimeout(r,400));

  await printBio();
  showPrompt();
}

runTTY();

window.addEventListener('keydown', (e)=>{
  if(/[1-7]/.test(e.key) && document.activeElement.tagName !== 'INPUT'){ const found = links.find(x=>x.k === e.key); if(found) window.open(found.u, '_blank'); }
});
</script>
</body>
</html>
