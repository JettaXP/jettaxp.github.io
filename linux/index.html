<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JettaX | Linux</title>
  <style>
    body { background: #0b0c0d; color: #cfe; font-family: monospace; padding: 24px; }
    .term { max-width: 1100px; margin: 24px auto; background: #060606; border-radius: 8px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    .prompt { color: #8be; }
    a { color: #8be; text-decoration: none; }
    .dir { color: #9fd; margin-right: 14px; }
    .layout { display: none; max-width: 1100px; margin: 18px auto; gap: 18px; }
    .pane { background: #020202; padding: 18px; border-radius: 8px; }
    .left { width: 45%; float: left; }
    .right { width: 50%; float: right; }
    .tree ul { list-style: none; padding-left: 0; }
    .tree li { padding: 6px 8px; border-radius: 6px; }
    .tree li.selected { background: rgba(139,190,255,0.08); outline: 1px solid rgba(139,190,255,0.12); }
    .clearfix::after { content: ''; display: table; clear: both; }4
  </style>
</head>
<body>
  <div class="term" id="tty">
    <pre id="tty-content">
EndeavourOS 7.0.8-arch1-1 (tty3)

<span class="prompt">jettax@pixel:~$</span> 
    </pre>
  </div>

  <div class="layout clearfix" id="layout">
    <div class="pane left" id="bio">
      <h3>Bio</h3>
      <p>Привет — здесь краткая биография jettax. Небольшой текст, который занимает левую панель. Можно добавить контакты и ссылки.</p>
    </div>
    <div class="pane right" id="links">
      <h3>Дерево ссылок</h3>
      <div class="tree" tabindex="0">
        <ul id="link-list">
          <li data-href="/">home</li>
          <li data-href="/ai">AI main</li>
          <li data-href="https://github.com/JettaXP">GitHub</li>
          <li data-href="https://t.me/jettaxp">Telegram</li>
          <li data-href="/material">Site tree: material</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const tty = document.getElementById('tty-content');
    const layout = document.getElementById('layout');
    const linkList = document.getElementById('link-list');
    const items = Array.from(linkList.querySelectorAll('li'));
    let sel = 0;

    function type(text, el, delay = 40) {
      return new Promise(resolve => {
        let i = 0;
        const t = setInterval(() => {
          el.innerHTML = el.innerHTML + text.charAt(i);
          i++;
          if (i >= text.length) { clearInterval(t); resolve(); }
        }, delay);
      });
    }

    async function run() {
      // type the bash command
      await type('bash jettax.xyz/linux/.sh', tty, 60);
      await new Promise(r => setTimeout(r, 600));
      // transition to layout
      document.getElementById('tty').style.display = 'none';
      layout.style.display = 'flex';
      // init selection
      updateSelection();
      linkList.parentElement.focus();
    }

    function updateSelection() {
      items.forEach((it, idx) => {
        it.classList.toggle('selected', idx === sel);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (layout.style.display !== 'flex') return;
      if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); updateSelection(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); updateSelection(); e.preventDefault(); }
      if (e.key === 'Enter') { const href = items[sel].dataset.href; if (href) location.href = href; }
    });

    // start typing after small delay
    setTimeout(run, 400);
  </script>
</body>
</html>
