<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JettaX | AI Linux (TTY)</title>
</head>
<body>
<script>
// Load the main AI page in linux device mode and strip floating windows, preserving the TTY-based AI UI
fetch('/ai/index.html',{cache:'no-cache'}).then(r=>r.text()).then(h=>{
  // force device linux by replacing body start tag
  h = h.replace(/<body(\s|>)/i, '<body data-device="linux">');
  // inject style to hide floating windows early and ensure base href
  h = h.replace('<head>', '<head><style>.ee-zone, .ee-zone2, .ee-overlay, .ee-window, .blob { display:none !important; }</style><base href="/ai/">');
  document.open(); document.write(h); document.close();
}).catch(()=>{ document.body.innerText = 'Ошибка загрузки AI.'; });
</script>
</body>
</html>
