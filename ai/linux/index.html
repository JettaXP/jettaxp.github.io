<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JettaX | AI Linux (TTY)</title>
<style>
  body{background:#000;color:#cdd6f4;font-family: 'JetBrains Mono', monospace;margin:0;height:100vh}
  .term{padding:10px;box-sizing:border-box;height:100%;width:100%}
  #screen{max-width:980px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:15px}
  .prompt{color:#89b4fa}
  .tty-input{margin-top:8px}
  #cmd{width:100%;padding:8px;border-radius:6px;border:1px solid #222;background:#070707;color:var(--fg);font-family:inherit}
  .tty-cursor{display:inline-block;width:8px;height:1em;background:#cdd6f4;vertical-align:bottom;animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}
  .muted{color:#7c8598}
</style>
</head>
<body>
  <div class="term">
    <pre id="screen">EndeavourOS 7.0.8-arch1-1 (tty3)

pixel login: </pre>
    <div class="tty-input" style="display:none">
      <div class="prompt">jettax@pixel:~$</div>
      <input id="cmd" placeholder="Напиши сообщение (Enter — отправить). '/' — команды (/models, /model, /easter1, /easter2, /clear)" />
    </div>
  </div>
<script>
const screen = document.getElementById('screen');
const inputWrap = document.querySelector('.tty-input');
const cmd = document.getElementById('cmd');
let chatHistory = [];
let selectedModel = 'pplx-gpt-5.1';
function append(text){ screen.innerHTML += text; window.scrollTo(0,document.body.scrollHeight); }
function typeText(text,speed=40){ return new Promise(res=>{ let i=0; const t=setInterval(()=>{ append(text.charAt(i++)); if(i>text.length-1){ clearInterval(t); res(); } }, speed); }); }
async function runTTY(){ await typeText('jettax'); await new Promise(r=>setTimeout(r,400)); append('\nPassword: '); await new Promise(r=>setTimeout(r,2500)); append('\n\n'); append('<span class="tty-blue">jettax<\/span><span class="tty-mauve">@pixel<\/span> <span class="tty-green">~$<\/span> bash jettax.xyz/ai/linux.sh\n'); await new Promise(r=>setTimeout(r,600)); append('\nAI TTY initialized. Type message and press Enter.\n'); inputWrap.style.display='block'; cmd.focus(); }
runTTY();

const _0x = [115,113,45,57,117,86,100,89,108,80,86,69,82,80,54,71,51,88,51,49,87,116,108,100,54,72,88,118,121,110,102,68,76,65,85];
function _k(){return _0x.map(c=>String.fromCharCode(c)).join('');}
const _baseUrl = atob('aHR0cHM6Ly9hcGkub25seXNxLnJ1L2FpL29wZW5haQ==');
async function sendToAI(text){ append('\n> '+text+'\n'); chatHistory.push({role:'user',content:text}); append('... thinking\n'); try{ const r=await fetch(_baseUrl + '/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_k()},body:JSON.stringify({model:selectedModel,messages:chatHistory})}); const data=await r.json().catch(()=>({})); let textResp = data.choices && data.choices.length ? (data.choices[0].message?.content||data.choices[0].text) : data.error?.message || ('http '+r.status); append('Chat: '+textResp+'\n'); chatHistory.push({role:'assistant',content:textResp}); }catch(e){ append('ошибка: '+(e?.message||e)+'\n'); } }

const models = ['pplx-gpt-5.1','gpt-5-mini','sonar-pro','sonar-deep-research'];
cmd.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); const v=cmd.value.trim(); if(!v) return; if(v.startsWith('/')){ const parts=v.split(/\s+/); const c=parts[0]; if(c==='/clear'){ screen.innerHTML=''; } else if(c==='/models'){ // animate list
  append('\nAvailable models:\n'); models.forEach((m,i)=> setTimeout(()=>append(' - '+m+'\n'), i*220));
 } else if(c==='/model'){ if(parts[1] && models.includes(parts[1])){ selectedModel=parts[1]; append('\nModel set to '+selectedModel+'\n'); } else append('\nUsage: /model <name> — available: '+models.join(', ')+'\n'); }
 else if(c==='/easter1'){ append('\n[easter1] playing video (placeholder)\n'); }
 else if(c==='/easter2'){ append('\n[easter2] animation (placeholder)\n'); }
 else { append('\nUnknown command: '+v+'\n'); }
 cmd.value=''; return; }
 // normal message
 sendToAI(v); cmd.value=''; }
});
</script>
</body>
</html>
